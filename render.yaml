# Opcional: "Blueprint" para crear el servicio en Render con un clic.
services:
  - type: web
    name: threed-organ-inc-django
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # la pegas tú en el panel de Render
      - key: GOOGLE_AI_API_KEY
        sync: false
